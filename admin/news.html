<!DOCTYPE html>
<html lang="ja">
<head>
<!-- @include admin-head -->
<title>お知らせ｜割烹 舞ぅ 管理画面</title>
</head>
<body>
<!-- @include admin-header -->
<main class="a-main" id="main" hidden>
  <h1 class="a-title">お知らせ<span class="sp"></span><button type="button" class="b b--sm b--black" id="newBtn">＋ 新しく書く</button></h1>
  <form class="panel" id="f" novalidate hidden>
    <h2 id="formTitle" tabindex="-1">お知らせを書く</h2>
    <div class="row">
      <label class="fld">日付<input type="date" name="published_on" required></label>
      <label class="fld">タグ<input name="tag" list="tagList" maxlength="20" required><datalist id="tagList"><option value="お知らせ"><option value="休業"><option value="メニュー"></datalist></label>
    </div>
    <label class="fld">タイトル<input name="title" maxlength="100" required></label>
    <label class="fld">本文<span class="hint">お知らせ一覧で開くと表示されます</span><textarea name="body" rows="6"></textarea></label>
    <div class="checks"><label><input type="checkbox" name="is_published">サイトに公開する</label></div>
    <p class="msg" id="msg" role="alert"></p>
    <div class="btns">
      <button type="button" class="b b--line" id="cancelBtn">閉じる</button>
      <button type="submit" class="b b--black">保存する</button>
    </div>
    <div class="btns" id="delWrap" hidden><button type="button" class="b b--line" id="delBtn">このお知らせを削除</button></div>
    <div class="warn" id="warn" hidden></div>
  </form>
  <section class="panel" aria-label="お知らせの一覧">
    <ul class="tlist" id="list"><li class="empty">読み込み中…</li></ul>
  </section>
</main>
<script type="module" src="/js/admin/news.js"></script>
</body>
</html>
