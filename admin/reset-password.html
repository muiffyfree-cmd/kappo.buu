<!DOCTYPE html>
<html lang="ja">
<head>
<!-- @include admin-head -->
<title>パスワードの再設定｜割烹 舞ぅ 管理画面</title>
</head>
<body>
<main class="login" id="main">
  <div class="card">
    <img class="logo" src="/assets/img/logo-black.png" alt="割烹 舞ぅ" width="64" height="64">
    <h1>パスワードの再設定</h1>

    <p class="muted" id="checking" role="status">リンクを確認しています…</p>

    <form id="newPwForm" novalidate hidden>
      <p class="muted">新しいパスワードを入力してください（8文字以上）。</p>
      <label class="fld">新しいパスワード<input type="password" name="password" autocomplete="new-password" minlength="8" required></label>
      <label class="fld">もう一度入力<input type="password" name="confirm" autocomplete="new-password" minlength="8" required></label>
      <p class="msg" id="newPwMsg" role="alert"></p>
      <div class="btns"><button class="b b--black b--wide" type="submit">パスワードを変更する</button></div>
    </form>

    <div id="doneBox" hidden role="status">
      <p>パスワードを変更しました。管理画面に移動します…</p>
      <div class="btns"><a class="b b--black b--wide" href="/admin/">管理画面へ</a></div>
    </div>

    <form id="resendForm" novalidate hidden>
      <p class="msg" id="expiredMsg" role="alert">リンクの有効期限が切れています。</p>
      <p class="muted">お手数ですが、もう一度再設定メールをお送りください（リンクは1回だけ・一定時間内に使えます）。</p>
      <label class="fld">メールアドレス<input type="email" name="email" autocomplete="username" required></label>
      <p class="msg" id="resendMsg" role="alert"></p>
      <div class="btns"><button class="b b--black b--wide" type="submit">再設定メールを送る</button></div>
      <a class="link" href="/admin/login.html">ログインに戻る</a>
    </form>
  </div>
</main>
<script type="module" src="/js/admin/reset-password.js"></script>
</body>
</html>
